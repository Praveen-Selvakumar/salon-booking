
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Booking Confirmed</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f7f7;
            color: #222;
            min-height: 100vh;
        }

        .page {
            width: 100%;
            max-width: 600px;
            margin: auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            background: white;
            padding: 18px 20px;
            text-align: center;
            border-bottom: 1px solid #eee;
        }

        .header h2 {
            margin: 0;
            font-size: 20px;
        }

        /* Main */
        .content {
            flex: 1;
            padding: 35px 20px 30px;
        }

        /* Success Icon */
        .success-icon {
            width: 80px;
            height: 80px;
            margin: 10px auto 20px;

            border-radius: 50%;
            background: #222;

            display: flex;
            align-items: center;
            justify-content: center;

            color: white;
            font-size: 42px;
            font-weight: bold;
        }

        .success-title {
            text-align: center;
            font-size: 26px;
            margin: 0 0 8px;
        }

        .success-message {
            text-align: center;
            color: #666;
            font-size: 15px;
            line-height: 1.5;
            margin-bottom: 30px;
        }

        /* Booking Card */
        .booking-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #e5e5e5;
        }

        .booking-card h3 {
            margin: 0 0 20px;
            font-size: 18px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            padding: 13px 0;
            border-bottom: 1px solid #eee;
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .detail-label {
            color: #777;
            font-size: 14px;
        }

        .detail-value {
            font-size: 15px;
            font-weight: bold;
            text-align: right;
        }

        /* Buttons */
        .buttons {
            margin-top: 25px;
        }

        .whatsapp-btn {
            width: 100%;
            border: none;
            border-radius: 8px;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;

            background: #25D366;
            color: white;
        }

        .home-btn {
            display: block;
            width: 100%;
            margin-top: 18px;

            border: none;
            background: transparent;

            color: #222;
            text-align: center;

            font-size: 15px;
            font-weight: bold;
            text-decoration: underline;

            cursor: pointer;
        }

        /* Booking ID */
        .booking-id {
            text-align: center;
            margin-top: 25px;
            color: #888;
            font-size: 13px;
        }

        @media (min-width: 601px) {
            .page {
                background: #f7f7f7;
            }

            .content {
                padding-left: 30px;
                padding-right: 30px;
            }
        }
    </style>
</head>

<body>

<div class="page">

    <!-- Header -->
    <div class="header">
        <h2>Booking Confirmed</h2>
    </div>


    <!-- Content -->
    <div class="content">

        <!-- Success -->
        <div class="success-icon">
            ✓
        </div>

        <h1 class="success-title">
            Booking Confirmed!
        </h1>

        <p class="success-message">
            Your appointment has been successfully booked.
            Please arrive a few minutes before your appointment.
        </p>


        <!-- Booking Details -->
        <div class="booking-card">

            <h3>Booking Details</h3>

            <div class="detail-row">
                <span class="detail-label">
                    Service
                </span>

                <span class="detail-value" id="service">
                    -
                </span>
            </div>


            <div class="detail-row">
                <span class="detail-label">
                    Date
                </span>

                <span class="detail-value" id="date">
                    -
                </span>
            </div>


            <div class="detail-row">
                <span class="detail-label">
                    Time
                </span>

                <span class="detail-value" id="time">
                    -
                </span>
            </div>


            <div class="detail-row">
                <span class="detail-label">
                    Customer
                </span>

                <span class="detail-value" id="customer">
                    -
                </span>
            </div>


            <div class="detail-row">
                <span class="detail-label">
                    Mobile
                </span>

                <span class="detail-value" id="mobile">
                    -
                </span>
            </div>

        </div>


        <!-- Booking ID -->
        <div class="booking-id">
            Booking ID: <strong id="bookingId">---</strong>
        </div>


        <!-- Buttons -->
        <div class="buttons">

            <button
                class="whatsapp-btn"
                onclick="shareWhatsApp()">

                Share on WhatsApp

            </button>


            <button
                class="home-btn"
                onclick="goHome()">

                Back to Home

            </button>

        </div>

    </div>

</div>


<script>

    /*
     * Get booking information
     * from confirm_booking.html
     */

    const params =
        new URLSearchParams(window.location.search);


    const service =
        params.get("service") || "Selected Service";

    const date =
        params.get("date") || "-";

    const time =
        params.get("time") || "-";

    const customer =
        params.get("customer") || "-";

    const mobile =
        params.get("mobile") || "-";


    /*
     * Display booking details
     */

    document.getElementById("service").textContent =
        service;

    document.getElementById("date").textContent =
        formatDate(date);

    document.getElementById("time").textContent =
        time;

    document.getElementById("customer").textContent =
        customer;

    document.getElementById("mobile").textContent =
        mobile;


    /*
     * Generate simple booking ID
     */

    const bookingId =
        "SAL" +
        Date.now().toString().slice(-6);

    document.getElementById("bookingId").textContent =
        bookingId;


    /*
     * Format date
     */

    function formatDate(dateString) {

        if (!dateString || dateString === "-") {
            return "-";
        }

        const dateObject =
            new Date(dateString);

        if (isNaN(dateObject)) {
            return dateString;
        }

        return dateObject.toLocaleDateString(
            "en-IN",
            {
                day: "numeric",
                month: "short",
                year: "numeric"
            }
        );
    }


    /*
     * WhatsApp Share
     */

    function shareWhatsApp() {

        const message =
            "🎉 Appointment Confirmed!\n\n" +

            "Service: " + service + "\n" +

            "Date: " + formatDate(date) + "\n" +

            "Time: " + time + "\n\n" +

            "Booking ID: " + bookingId + "\n\n" +

            "Thank you for booking with us!";


        const whatsappUrl =
            "https://wa.me/?text=" +
            encodeURIComponent(message);


        window.open(
            whatsappUrl,
            "_blank"
        );
    }


    /*
     * Back to Salon Home
     */

    function goHome() {

        window.location.href =
            "saloon_dashboard.html";
    }

</script>

</body>
</html>
